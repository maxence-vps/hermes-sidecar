# Example: run the sidecar next to Hermes on a shared internal network.
# Only the sidecar is reachable from outside (through your reverse proxy).
services:
  hermes:
    # Your existing Hermes service. Do not publish port 8642 on the host.
    image: your-hermes-image
    env_file: ~/.hermes/.env
    volumes:
      - hermes-data:/opt/data
    networks: [hermes-internal]

  sidecar:
    build: .
    env_file: ~/.hermes/.env # same API_SERVER_KEY as Hermes
    environment:
      HERMES_URL: http://hermes:8642
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
      API_DOCS_ENABLED: "false" # true serves /openapi.json and /docs
      HERMES_MEDIA_DIR: /media/native-inputs # GET /media/{sha256}
      DATABASE_PATH: /data/sidecar.db # projects
    # Hermes's user: the stored images are readable by their owner only.
    user: "10000:10000"
    volumes:
      # The sidecar's own database.
      - sidecar-data:/data
      # Only the image store, read-only (subpath needs Docker 26+).
      - type: volume
        source: hermes-data
        target: /media/native-inputs
        read_only: true
        volume:
          subpath: cache/documents/native-inputs
    networks: [hermes-internal]
    # Put your reverse proxy (Traefik, Caddy, nginx) in front for HTTPS.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  hermes-data:
  sidecar-data:

networks:
  hermes-internal:
